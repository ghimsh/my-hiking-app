<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>등산 지도</title>
<style>
:root{--bg:#fff;--fg:#1c1c1e;--mut:#6b6b70;--line:#e2e2e6;--acc:#2e7d32;--dng:#d32f2f;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1f22;--fg:#f2f2f4;--mut:#9a9aa2;--line:#37383c;--acc:#66bb6a;--dng:#ef5350}}
:root[data-theme="dark"]{--bg:#1e1f22;--fg:#f2f2f4;--mut:#9a9aa2;--line:#37383c;--acc:#66bb6a;--dng:#ef5350}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif;overflow:hidden;-webkit-text-size-adjust:100%}
#map{position:absolute;inset:0;background:#cfd8cf}
.leaflet-container{overflow:hidden;position:relative;touch-action:none;-webkit-tap-highlight-color:transparent;outline:0}
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-layer,.leaflet-tile-container{position:absolute;left:0;top:0}
.leaflet-tile,.leaflet-marker-icon{user-select:none;-webkit-user-drag:none}
.leaflet-tile{visibility:hidden}.leaflet-tile-loaded{visibility:inherit}
.leaflet-container img.leaflet-tile{max-width:none!important}
.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-marker-pane{z-index:600}
.leaflet-overlay-pane svg{max-width:none!important}
.leaflet-zoom-animated{transform-origin:0 0}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-zoom-anim .leaflet-tile{transition:none}
.leaflet-fade-anim .leaflet-tile{will-change:opacity}
.leaflet-interactive{cursor:pointer}
.pin{width:28px;height:28px;border-radius:50%;background:var(--acc);color:#fff;border:2px solid #fff;font:700 13px/24px sans-serif;text-align:center;box-shadow:0 1px 4px #0006}
.pin.sel{background:var(--dng);transform:scale(1.25)}
.bar{position:absolute;z-index:1000;left:0;right:0;padding:8px 10px}
#top{top:0;padding-top:calc(env(safe-area-inset-top,0px) + 8px);display:flex;gap:6px;pointer-events:none}
#top>*{pointer-events:auto}
.seg{display:flex;background:var(--bg);border-radius:12px;box-shadow:0 1px 6px #0004;overflow:hidden}
button{font:inherit;color:var(--fg);background:var(--bg);border:0;padding:10px 13px;font-size:14px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
button.on{background:var(--acc);color:#fff}
#side{position:absolute;z-index:1000;right:10px;bottom:calc(var(--sheet,150px) + 14px);display:flex;flex-direction:column;gap:8px}
#side button{width:48px;height:48px;border-radius:50%;box-shadow:0 1px 6px #0005;font-size:20px;padding:0}
#sheet{position:absolute;z-index:1000;left:0;right:0;bottom:0;background:var(--bg);border-radius:18px 18px 0 0;box-shadow:0 -2px 12px #0004;padding:12px 14px calc(env(safe-area-inset-bottom,0px) + 12px)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sum{font-size:15px;font-weight:600}.sub{font-size:12px;color:var(--mut)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;min-height:48px}
.chip{flex:none;border:1px solid var(--line);border-radius:16px;padding:6px 12px;font-size:13px}
.chip.sel{border-color:var(--dng);color:var(--dng)}
.del{background:var(--dng);color:#fff;border-radius:10px;font-weight:600}
.ghost{border:1px solid var(--line);border-radius:10px}
#toast{position:absolute;z-index:1100;left:50%;top:calc(env(safe-area-inset-top,0px) + 60px);transform:translateX(-50%);background:#000c;color:#fff;padding:8px 14px;border-radius:14px;font-size:13px;display:none;max-width:85%}
#attr{position:absolute;z-index:900;left:6px;bottom:calc(var(--sheet,150px) + 2px);font-size:9px;color:#333;background:#fffa;padding:1px 4px;border-radius:4px}
</style>
</head>
<body>
<div id="map"></div>
<div class="bar" id="top">
  <div class="seg"><button id="bTopo" class="on">지형도</button><button id="bOsm">일반</button></div>
  <div class="seg"><button id="bTrail" class="on">등산로</button></div>
</div>
<div id="toast"></div>
<div id="side">
  <button id="bAddMe" title="내 위치에 웨이포인트 추가">📌</button>
  <button id="bLoc" title="현재 위치">◎</button>
</div>
<div id="attr">© OpenStreetMap · OpenTopoMap · Waymarked Trails</div>
<div id="sheet">
  <div class="row">
    <div><div class="sum" id="sum">웨이포인트 0개</div><div class="sub" id="hint">지도를 터치하면 웨이포인트가 추가됩니다</div></div>
    <button class="ghost" id="bClear">전체 삭제</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="row" id="detail" style="display:none"><div><div class="sum" id="dName"></div><div class="sub" id="dInfo"></div></div><button class="del" id="bDel">삭제</button></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
(function(){
var map=L.map('map',{zoomControl:false,attributionControl:false,tap:true}).setView([37.659,126.977],12);
var topo=L.tileLayer('https://tile.opentopomap.org/{z}/{x}/{y}.png',{maxZoom:17});
var osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19});
var trail=L.tileLayer('https://tile.waymarkedtrails.org/hiking/{z}/{x}/{y}.png',{maxZoom:18,opacity:.85});
var base=topo.addTo(map);trail.addTo(map);
var $=function(i){return document.getElementById(i)};

function setBase(l,on,off){map.removeLayer(base);base=l.addTo(map);base.bringToBack();on.classList.add('on');off.classList.remove('on')}
$('bTopo').onclick=function(){setBase(topo,$('bTopo'),$('bOsm'))};
$('bOsm').onclick=function(){setBase(osm,$('bOsm'),$('bTopo'))};
$('bTrail').onclick=function(){if(map.hasLayer(trail)){map.removeLayer(trail);this.classList.remove('on')}else{trail.addTo(map);this.classList.add('on')}};

var toastT;function toast(m){var t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toastT);toastT=setTimeout(function(){t.style.display='none'},3000)}

/* 웨이포인트 */
var wps=[],sel=-1,markers=[],line=L.polyline([],{color:'#d84315',weight:4,opacity:.9,dashArray:'8 6'}).addTo(map);
try{wps=JSON.parse(localStorage.getItem('hk_wps')||'[]')}catch(e){wps=[]}
function save(){try{localStorage.setItem('hk_wps',JSON.stringify(wps))}catch(e){}}
function dist(a,b){var R=6371,r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lng-a.lng)*r,x=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)*Math.sin(dn/2);return 2*R*Math.asin(Math.sqrt(x))}
function total(){var s=0;for(var i=1;i<wps.length;i++)s+=dist(wps[i-1],wps[i]);return s}
function fmt(k){return k<1?Math.round(k*1000)+' m':k.toFixed(2)+' km'}

function render(){
  markers.forEach(function(m){map.removeLayer(m)});markers=[];
  wps.forEach(function(w,i){
    var m=L.marker([w.lat,w.lng],{draggable:true,icon:L.divIcon({className:'',html:'<div class="pin'+(i===sel?' sel':'')+'">'+(i+1)+'</div>',iconSize:[28,28],iconAnchor:[14,14]})}).addTo(map);
    m.on('click',function(){sel=(sel===i?-1:i);render()});
    m.on('drag',function(e){var p=e.target.getLatLng();w.lat=p.lat;w.lng=p.lng;line.setLatLngs(wps.map(function(x){return[x.lat,x.lng]}))});
    m.on('dragend',function(){save();render()});
    markers.push(m);
  });
  line.setLatLngs(wps.map(function(x){return[x.lat,x.lng]}));
  $('sum').textContent='웨이포인트 '+wps.length+'개'+(wps.length>1?' · 총 '+fmt(total()):'');
  $('hint').textContent=wps.length?'핀을 터치해 선택, 드래그해 이동':'지도를 터치하면 웨이포인트가 추가됩니다';
  var c=$('chips');c.innerHTML='';
  wps.forEach(function(w,i){var b=document.createElement('div');b.className='chip'+(i===sel?' sel':'');b.textContent=(i+1)+'번';b.onclick=function(){sel=i;map.panTo([w.lat,w.lng]);render()};c.appendChild(b)});
  var d=$('detail');
  if(sel>=0&&wps[sel]){var w=wps[sel];d.style.display='flex';$('dName').textContent=(sel+1)+'번 웨이포인트';
    $('dInfo').textContent=w.lat.toFixed(5)+', '+w.lng.toFixed(5)+(sel>0?' · 이전 지점까지 '+fmt(dist(wps[sel-1],w)):'')}
  else d.style.display='none';
  document.documentElement.style.setProperty('--sheet',$('sheet').offsetHeight+'px');
  save();
}
function add(lat,lng){wps.push({lat:lat,lng:lng});sel=wps.length-1;render()}
map.on('click',function(e){add(e.latlng.lat,e.latlng.lng)});
$('bDel').onclick=function(){if(sel>=0){wps.splice(sel,1);sel=-1;render()}};
$('bClear').onclick=function(){if(wps.length&&confirm('웨이포인트를 모두 삭제할까요?')){wps=[];sel=-1;render()}};

/* 현재 위치 */
var me=null,acc=null,watch=null,first=true;
function onPos(p){
  var ll=[p.coords.latitude,p.coords.longitude];
  if(!me){me=L.circleMarker(ll,{radius:8,color:'#fff',weight:3,fillColor:'#1976d2',fillOpacity:1,interactive:false}).addTo(map);
    acc=L.circle(ll,{radius:p.coords.accuracy,color:'#1976d2',weight:1,fillOpacity:.12,interactive:false}).addTo(map)}
  else{me.setLatLng(ll);acc.setLatLng(ll);acc.setRadius(p.coords.accuracy)}
  if(first){first=false;map.setView(ll,Math.max(map.getZoom(),15))}
}
function onErr(e){toast(e.code===1?'위치 권한이 거부되었습니다. 설정에서 허용해 주세요.':'현재 위치를 가져올 수 없습니다.');first=true}
function locate(){
  if(!navigator.geolocation){toast('이 브라우저는 위치 기능을 지원하지 않습니다.');return}
  if(watch===null)watch=navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,maximumAge:5000,timeout:20000});
  if(me)map.setView(me.getLatLng(),Math.max(map.getZoom(),15));else{first=true;toast('위치를 확인하는 중…')}
}
$('bLoc').onclick=locate;
$('bAddMe').onclick=function(){
  if(!me){locate();toast('위치 확인 후 다시 눌러 주세요.');return}
  var p=me.getLatLng();add(p.lat,p.lng);
};
render();
window.addEventListener('resize',function(){map.invalidateSize();render()});
})();
</script>
</body>
</html>
