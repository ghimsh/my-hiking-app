<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scaleable=no">
  <title>등산 지도 & 위치 트래커</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #121212; color: #ffffff; }
    
    #app-container { display: flex; flex-direction: column; height: 100vh; width: 100vw; }
    
    /* Header */
    header { height: 50px; background: #1f1f1f; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid #333; z-index: 1000; }
    header h1 { font-size: 1.1rem; font-weight: 600; color: #4caf50; display: flex; align-items: center; gap: 8px; }
    .status-badge { font-size: 0.75rem; padding: 4px 8px; border-radius: 12px; background: #333; color: #aaa; font-weight: 500; }
    .status-badge.active { background: rgba(76, 175, 80, 0.2); color: #4caf50; border: 1px solid #4caf50; }

    /* Map */
    #map { flex: 1; width: 100%; z-index: 1; }

    /* Floating Action Buttons on Map */
    .map-controls { position: absolute; top: 60px; right: 12px; z-index: 999; display: flex; flex-direction: column; gap: 10px; }
    .btn-fab { width: 44px; height: 44px; border-radius: 50%; background: #2a2a2a; color: #fff; border: 1px solid #444; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; box-shadow: 0 4px 10px rgba(0,0,0,0.5); cursor: pointer; }
    .btn-fab:active { transform: scale(0.95); background: #333; }
    .btn-fab.tracking { background: #e53935; border-color: #ff5252; animation: pulse 1.5s infinite; }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(229, 57, 53, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(229, 57, 53, 0); }
      100% { box-shadow: 0 0 0 0 rgba(229, 57, 53, 0); }
    }

    /* Info Bar Overlay */
    .info-overlay { position: absolute; top: 60px; left: 12px; z-index: 999; background: rgba(30, 30, 30, 0.85); backdrop-filter: blur(8px); padding: 10px 14px; border-radius: 12px; border: 1px solid #444; display: flex; gap: 16px; font-size: 0.8rem; }
    .info-item { display: flex; flex-direction: column; }
    .info-item .label { color: #888; font-size: 0.7rem; }
    .info-item .value { font-weight: bold; font-size: 0.95rem; color: #fff; }

    /* Bottom Panel */
    .bottom-panel { height: 220px; background: #1e1e1e; border-top: 1px solid #333; display: flex; flex-direction: column; z-index: 1000; }
    .tab-buttons { display: flex; border-bottom: 1px solid #2d2d2d; background: #181818; }
    .tab-btn { flex: 1; padding: 12px 0; background: none; border: none; color: #888; font-size: 0.85rem; font-weight: 600; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 6px; }
    .tab-btn.active { color: #4caf50; border-bottom: 2px solid #4caf50; background: #1e1e1e; }

    .tab-content { flex: 1; padding: 12px; overflow-y: auto; display: none; }
    .tab-content.active { display: block; }

    /* List Item Styling */
    .wp-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #282828; border-radius: 8px; margin-bottom: 8px; border: 1px solid #333; }
    .wp-info { display: flex; flex-direction: column; gap: 2px; }
    .wp-title { font-weight: bold; font-size: 0.9rem; color: #fff; }
    .wp-meta { font-size: 0.75rem; color: #aaa; }
    .btn-delete { background: none; border: none; color: #ff5252; font-size: 1rem; cursor: pointer; padding: 4px 8px; }

    /* Popup Style Override for Dark Theme */
    .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: #282828 !important; color: #fff !important; border: 1px solid #444; }
    .popup-form { display: flex; flex-direction: column; gap: 8px; width: 200px; padding: 4px; }
    .popup-form input, .popup-form select, .popup-form textarea { width: 100%; padding: 8px; background: #181818; border: 1px solid #444; color: #fff; border-radius: 4px; font-size: 0.85rem; }
    .popup-form button { background: #4caf50; color: #fff; border: none; padding: 8px; border-radius: 4px; font-weight: bold; cursor: pointer; }

    /* Utility */
    .btn-action { width: 100%; padding: 10px; background: #333; border: 1px solid #444; color: #fff; border-radius: 6px; font-size: 0.85rem; cursor: pointer; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-action:hover { background: #444; }
  </style>
</head>
<body>

  <div id="app-container">
    <header>
      <h1><i class="fa-solid fa-mountain"></i> 등산 트래커</h1>
      <span id="status-badge" class="status-badge">대기 중</span>
    </header>

    <div style="position: relative; flex: 1; width: 100%;">
      <div id="map"></div>

      <!-- Info Bar -->
      <div class="info-overlay">
        <div class="info-item">
          <span class="label">고도</span>
          <span id="stat-alt" class="value">-- m</span>
        </div>
        <div class="info-item">
          <span class="label">이동 거리</span>
          <span id="stat-dist" class="value">0.0 km</span>
        </div>
        <div class="info-item">
          <span class="label">경과 시간</span>
          <span id="stat-time" class="value">00:00</span>
        </div>
      </div>

      <!-- Map Floating Buttons -->
      <div class="map-controls">
        <button id="btn-recenter" class="btn-fab" title="내 위치로"><i class="fa-solid fa-crosshairs"></i></button>
        <button id="btn-add-wp" class="btn-fab" title="현재 위치에 웨이포인트 추가"><i class="fa-solid fa-map-pin"></i></button>
        <button id="btn-toggle-track" class="btn-fab" title="트래킹 시작/정지"><i class="fa-solid fa-play"></i></button>
      </div>
    </div>

    <!-- Bottom Dashboard Panel -->
    <div class="bottom-panel">
      <div class="tab-buttons">
        <button class="tab-btn active" data-tab="tab-waypoints"><i class="fa-solid fa-list"></i> 웨이포인트 (<span id="wp-count">0</span>)</button>
        <button class="tab-btn" data-tab="tab-settings"><i class="fa-solid fa-gear"></i> 설정 / 내보내기</button>
      </div>

      <div id="tab-waypoints" class="tab-content active">
        <div id="wp-list">
          <p style="color: #666; text-align: center; margin-top: 20px; font-size: 0.85rem;">
            지도를 터치하거나 📍 버튼을 눌러<br>웨이포인트를 추가해 보세요.
          </p>
        </div>
      </div>

      <div id="tab-settings" class="tab-content">
        <button id="btn-export-gpx" class="btn-action"><i class="fa-solid fa-file-export"></i> GPX 파일로 저장하기</button>
        <button id="btn-clear-data" class="btn-action" style="color: #ff5252;"><i class="fa-solid fa-trash"></i> 전체 데이터 초기화</button>
      </div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // --- Application State ---
    let map, userMarker, trackPolyline;
    let isTracking = false;
    let watchId = null;
    let currentPosition = null;
    let pathCoordinates = [];
    let waypoints = [];
    let totalDistance = 0; // in meters
    let startTime = null;
    let timerInterval = null;

    // Custom Marker Icons Mapping
    const typeIcons = {
      '쉼터': '☕',
      '약수터': '💧',
      '위험지역': '⚠️',
      '사진포인트': '📸',
      '기타': '📍'
    };

    // Initialize Map on Load
    window.addEventListener('DOMContentLoaded', () => {
      initMap();
      loadSavedData();
      setupUIEvents();
    });

    function initMap() {
      // Default: Seoul City Hall (Fallback)
      map = L.map('map', {
        zoomControl: false,
        tap: true // Enable mobile tap handling in Leaflet
      }).setView([37.5665, 126.9780], 15);

      // Add OpenTopoMap Layer (Topographic map with terrain contours)
      L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
        maxZoom: 17,
        attribution: 'Map data: &copy; OpenStreetMap, SRTM | Map style: &copy; OpenTopoMap'
      }).addTo(map);

      // Track Line Layer
      trackPolyline = L.polyline([], { color: '#ff3366', weight: 4, opacity: 0.8 }).addTo(map);

      // Direct Map Tap/Click Listener for manual Waypoint Creation
      map.on('click', onMapClick);

      // Request initial location
      getCurrentLocation();
    }

    function onMapClick(e) {
      const lat = e.latlng.lat;
      const lng = e.latlng.lng;
      
      const popupContent = `
        <div class="popup-form">
          <strong style="text-align:center;">새 웨이포인트 추가</strong>
          <input type="text" id="pop-name" placeholder="지점 이름 (예: 약수터)" />
          <select id="pop-type">
            <option value="쉼터">☕ 쉼터</option>
            <option value="약수터">💧 약수터</option>
            <option value="위험지역">⚠️ 위험지역</option>
            <option value="사진포인트">📸 사진포인트</option>
            <option value="기타" selected>📍 기타</option>
          </select>
          <textarea id="pop-note" placeholder="메모 (선택)"></textarea>
          <button onclick="saveWaypointFromPopup(${lat}, ${lng})">저장하기</button>
        </div>
      `;

      L.popup()
        .setLatLng(e.latlng)
        .setContent(popupContent)
        .openOn(map);
    }

    function saveWaypointFromPopup(lat, lng) {
      const name = document.getElementById('pop-name').value || '이름 없음';
      const type = document.getElementById('pop-type').value;
      const note = document.getElementById('pop-note').value;

      const newWp = {
        id: Date.now(),
        lat: lat,
        lng: lng,
        name: name,
        type: type,
        note: note,
        alt: currentPosition ? currentPosition.alt : null,
        time: new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })
      };

      waypoints.push(newWp);
      renderWaypointMarker(newWp);
      updateWaypointList();
      saveDataToStorage();

      map.closePopup();
    }

    function renderWaypointMarker(wp) {
      const iconEmoji = typeIcons[wp.type] || '📍';
      const customIcon = L.divIcon({
        html: `<div style="font-size: 22px; filter: drop-shadow(0px 2px 3px rgba(0,0,0,0.7));">${iconEmoji}</div>`,
        className: 'custom-wp-icon',
        iconSize: [28, 28],
        iconAnchor: [14, 14]
      });

      const marker = L.marker([wp.lat, wp.lng], { icon: customIcon }).addTo(map);
      
      marker.bindPopup(`
        <div style="font-size:0.85rem;">
          <strong style="color:#4caf50;">[${wp.type}] ${wp.name}</strong><br>
          ${wp.note ? `<span style="color:#ccc;">${wp.note}</span><br>` : ''}
          <small style="color:#888;">기록 시간: ${wp.time}</small>
        </div>
      `);

      wp.markerRef = marker;
    }

    function getCurrentLocation() {
      if (!navigator.geolocation) {
        alert('이 브라우저에서는 위치 서비스를 지원하지 않습니다.');
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          const alt = pos.coords.altitude;

          currentPosition = { lat, lng, alt };
          updateUserMarker(lat, lng);
          map.setView([lat, lng], 16);
          
          document.getElementById('stat-alt').textContent = alt ? `${Math.round(alt)} m` : 'N/A';
        },
        (err) => {
          console.warn(`Geolocation Error (${err.code}): ${err.message}`);
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    function updateUserMarker(lat, lng) {
      if (!userMarker) {
        const userIcon = L.divIcon({
          html: `<div style="width:16px; height:16px; background:#2196f3; border:3px solid #fff; border-radius:50%; box-shadow:0 0 8px rgba(33,150,243,0.8);"></div>`,
          className: 'user-pos-icon',
          iconSize: [16, 16],
          iconAnchor: [8, 8]
        });
        userMarker = L.marker([lat, lng], { icon: userIcon, zIndexOffset: 1000 }).addTo(map);
      } else {
        userMarker.setLatLng([lat, lng]);
      }
    }

    // --- Tracking Logic ---
    function toggleTracking() {
      const btn = document.getElementById('btn-toggle-track');
      const badge = document.getElementById('status-badge');

      if (!isTracking) {
        // Start Tracking
        isTracking = true;
        btn.classList.add('tracking');
        btn.innerHTML = '<i class="fa-solid fa-square"></i>';
        badge.classList.add('active');
        badge.textContent = '기록 중';

        if (!startTime) startTime = new Date();
        startTimer();

        watchId = navigator.geolocation.watchPosition(
          onPositionUpdate,
          (err) => console.warn(err),
          { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
        );
      } else {
        // Stop Tracking
        isTracking = false;
        btn.classList.remove('tracking');
        btn.innerHTML = '<i class="fa-solid fa-play"></i>';
        badge.classList.remove('active');
        badge.textContent = '일시 정지';

        if (watchId) navigator.geolocation.clearWatch(watchId);
        stopTimer();
      }
    }

    function onPositionUpdate(pos) {
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;
      const alt = pos.coords.altitude;

      currentPosition = { lat, lng, alt };
      updateUserMarker(lat, lng);

      // Distance calculation
      if (pathCoordinates.length > 0) {
        const prevLatLng = pathCoordinates[pathCoordinates.length - 1];
        const distDelta = map.distance(prevLatLng, [lat, lng]);
        if (distDelta > 3) { // Movement threshold > 3 meters
          totalDistance += distDelta;
          pathCoordinates.push([lat, lng]);
          trackPolyline.setLatLngs(pathCoordinates);
        }
      } else {
        pathCoordinates.push([lat, lng]);
      }

      // Update UI Stats
      document.getElementById('stat-dist').textContent = `${(totalDistance / 1000).toFixed(2)} km`;
      document.getElementById('stat-alt').textContent = alt ? `${Math.round(alt)} m` : 'N/A';
      
      saveDataToStorage();
    }

    // --- UI Controls & Event Listeners ---
    function setupUIEvents() {
      document.getElementById('btn-recenter').addEventListener('click', () => {
        if (currentPosition) {
          map.setView([currentPosition.lat, currentPosition.lng], 16);
        } else {
          getCurrentLocation();
        }
      });

      document.getElementById('btn-toggle-track').addEventListener('click', toggleTracking);

      document.getElementById('btn-add-wp').addEventListener('click', () => {
        if (!currentPosition) {
          alert('현재 GPS 위치 정보를 불러오는 중입니다. 잠시 후 다시 시도해 주세요.');
          return;
        }
        
        onMapClick({ latlng: L.latLng(currentPosition.lat, currentPosition.lng) });
      });

      // Bottom Tabs
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

          const targetTab = e.currentTarget.getAttribute('data-tab');
          e.currentTarget.classList.add('active');
          document.getElementById(targetTab).classList.add('active');
        });
      });

      document.getElementById('btn-export-gpx').addEventListener('click', exportGPX);
      document.getElementById('btn-clear-data').addEventListener('click', clearAllData);
    }

    function startTimer() {
      timerInterval = setInterval(() => {
        const now = new Date();
        const diffMs = now - startTime;
        const totalSecs = Math.floor(diffMs / 1000);
        const mins = Math.floor(totalSecs / 60).toString().padStart(2, '0');
        const secs = (totalSecs % 60).toString().padStart(2, '0');
        document.getElementById('stat-time').textContent = `${mins}:${secs}`;
      }, 1000);
    }

    function stopTimer() {
      if (timerInterval) clearInterval(timerInterval);
    }

    function updateWaypointList() {
      const listContainer = document.getElementById('wp-list');
      document.getElementById('wp-count').textContent = waypoints.length;

      if (waypoints.length === 0) {
        listContainer.innerHTML = `
          <p style="color: #666; text-align: center; margin-top: 20px; font-size: 0.85rem;">
            지도를 터치하거나 📍 버튼을 눌러<br>웨이포인트를 추가해 보세요.
          </p>`;
        return;
      }

      listContainer.innerHTML = '';
      waypoints.forEach((wp) => {
        const item = document.createElement('div');
        item.className = 'wp-item';
        item.innerHTML = `
          <div class="wp-info">
            <span class="wp-title">${typeIcons[wp.type] || '📍'} ${wp.name}</span>
            <span class="wp-meta">시간: ${wp.time} ${wp.alt ? `| 고도: ${Math.round(wp.alt)}m` : ''}</span>
          </div>
          <button class="btn-delete" onclick="deleteWaypoint(${wp.id})"><i class="fa-solid fa-trash"></i></button>
        `;
        listContainer.appendChild(item);
      });
    }

    function deleteWaypoint(id) {
      const idx = waypoints.findIndex(w => w.id === id);
      if (idx !== -1) {
        if (waypoints[idx].markerRef) {
          map.removeLayer(waypoints[idx].markerRef);
        }
        waypoints.splice(idx, 1);
        updateWaypointList();
        saveDataToStorage();
      }
    }

    // --- Persistence (LocalStorage) ---
    function saveDataToStorage() {
      const data = {
        pathCoordinates,
        totalDistance,
        waypoints: waypoints.map(w => ({ ...w, markerRef: null }))
      };
      localStorage.setItem('hiking_tracker_data', JSON.stringify(data));
    }

    function loadSavedData() {
      const saved = localStorage.getItem('hiking_tracker_data');
      if (saved) {
        try {
          const data = JSON.parse(saved);
          pathCoordinates = data.pathCoordinates || [];
          totalDistance = data.totalDistance || 0;
          waypoints = data.waypoints || [];

          if (pathCoordinates.length > 0) {
            trackPolyline.setLatLngs(pathCoordinates);
            document.getElementById('stat-dist').textContent = `${(totalDistance / 1000).toFixed(2)} km`;
          }

          waypoints.forEach(wp => renderWaypointMarker(wp));
          updateWaypointList();
        } catch (e) {
          console.error("데이터 복원 실패:", e);
        }
      }
    }

    function clearAllData() {
      if (confirm('모든 경로 기록 및 웨이포인트를 삭제하시겠습니까?')) {
        localStorage.removeItem('hiking_tracker_data');
        location.reload();
      }
    }

    // --- GPX File Export ---
    function exportGPX() {
      if (pathCoordinates.length === 0 && waypoints.length === 0) {
        alert('저장할 트랙이나 웨이포인트 데이터가 없습니다.');
        return;
      }

      let gpx = `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="Hiking Tracker App" xmlns="http://www.topografix.com/GPX/1/1">
  <metadata>
    <name>등산 경로 기록</name>
    <time>${new Date().toISOString()}</time>
  </metadata>\n`;

      // Waypoints
      waypoints.forEach(wp => {
        gpx += `  <wpt lat="${wp.lat}" lon="${wp.lng}">\n`;
        if (wp.alt) gpx += `    <ele>${wp.alt}</ele>\n`;
        gpx += `    <name>${escapeXml(wp.name)}</name>\n`;
        gpx += `    <desc>${escapeXml(wp.note || wp.type)}</desc>\n`;
        gpx += `  </wpt>\n`;
      });

      // Track
      if (pathCoordinates.length > 0) {
        gpx += `  <trk>\n    <name>등산 트랙</name>\n    <trkseg>\n`;
        pathCoordinates.forEach(pt => {
          gpx += `      <trkpt lat="${pt[0]}" lon="${pt[1]}"></trkpt>\n`;
        });
        gpx += `    </trkseg>\n  </trk>\n`;
      }

      gpx += `</gpx>`;

      const blob = new Blob([gpx], { type: 'application/gpx+xml' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `hiking_track_${new Date().toISOString().slice(0,10)}.gpx`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function escapeXml(unsafe) {
      return unsafe.replace(/[<>&'"]/g, (c) => {
        switch (c) {
          case '<': return '&lt;';
          case '>': return '&gt;';
          case '&': return '&amp;';
          case '\'': return '&apos;';
          case '"': return '&quot;';
        }
      });
    }
  </script>
</body>
</html>
